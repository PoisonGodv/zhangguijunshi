# nginx.conf — 掌柜军师 管理后台 server 块
#
# API base 现状: src/services/request.ts 硬编码 baseURL '/v1' (同源相对路径),
#   无运行期注入机制, 故走 nginx 同源反向代理 /v1/ → backend:8080, 避免 CORS。
#   (backend 为 docker-compose 服务名; 单机直连可改 upstream 或 environment 注入)
#
# 权限: nginx master root + worker nginx (非 root), 官方镜像默认, 此处不覆盖。

# gzip 压缩 (JS 主 chunk 3.2MB, gzip 后 ~1MB, 显著省带宽)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    # 前端最大请求体 (上传场景预留)
    client_max_body_size 20m;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- API 反向代理 (同源, 避免 CORS) ----------
    # backend = docker-compose 服务名; 单机直连改 host 即可 (如 127.0.0.1:8080)。
    #
    # 安全红线 (登录限流防绕过): X-Forwarded-For 必须用 $remote_addr 整体覆盖,
    # 不能用 $proxy_add_x_forwarded_for 追加。否则公网客户端可自带 XFF 头注入
    # 伪造的"最左"地址, 后端 Gin validateHeader 从右向左剥离受信代理(172.16/12
    # 的 nginx 容器)后会采信该伪造值, 导致登录限流器按伪造 IP 计数、绕过或嫁祸。
    # $remote_addr 是 nginx 看到的 TCP 对端, 客户端无法伪造, 以此为唯一 XFF 值,
    # 后端 ClientIP 即得到真实公网客户端地址 (与 X-Real-IP 一致)。
    location /v1/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        # 后端长连接 (AI 流式 / 导出等)
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 静态资源长缓存 ----------
    # Vite 产物: dist/assets/* 文件名带 hash, 可一年强缓存。
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA fallback ----------
    # 未命中静态文件的请求回退 index.html (React Router 前端路由)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 本身不缓存 (保证发版即时生效)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # favicon 等根目录静态 (无 hash, 短缓存)
    location ~* /(favicon\.ico|robots\.txt|manifest\.json)$ {
        access_log off;
        expires    1h;
        try_files $uri =404;
    }
}
