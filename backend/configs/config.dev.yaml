# Development configuration (local + CI default).
# Field names mirror the `mapstructure` tags in backend/pkg/config/types.go.
# Layering (low → high priority): defaults → this file → env vars (prefix ZG_).
# Durations are human-readable strings (e.g. "30s", "720h"); parsed by viper.
app:
  name: zhanggui-junshi-backend
  env: dev
  version: 0.1.0-dev

http:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "15s"
  write_timeout: "15s"
  shutdown_timeout: "30s"

postgres:
  host: localhost
  port: 5432
  user: zg
  password: zg
  database: zhanggui
  ssl_mode: disable
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: "30m"
  max_conn_idle_time: "5m"

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10

log:
  level: debug
  encoding: console
  output_paths:
    - stdout

jwt:
  # ES256 key: leave key_file empty to derive a deterministic dev key (logged on
  # boot). Set key_file to a PEM path only when testing real key loading.
  key_file: ""
  key_id: "zgjs-dev"
  access_ttl: "30m"
  refresh_ttl: "720h"
  issuer: zhanggui-junshi

# WeChat mini-program. code2session_url empty -> official endpoint. Point at a
# local fake server to exercise login end-to-end without real credentials.
wx:
  app_id: ""
  secret: ""
  code2session_url: ""
  timeout: "5s"

# AI gateway (POC). Providers configured via env in staging; defaults below.
ai:
  default_provider: ""
  request_timeout: "8s"
  monthly_budget_cny: 2.0
  providers: {}
  # Task-tier → provider+model routes (M3-S2 §13.3.7). Empty in dev → every
  # tier falls back to defaultRoute (all lite), matching M3-S1 behavior.
  # Staging/prod example:
  #   routes:
  #     lite: { provider: doubao, model: doubao-lite-32k }
  #     v3:   { provider: deepseek, model: deepseek-chat }
  #     r1:   { provider: deepseek, model: deepseek-reasoner }
  routes: {}

otel:
  enable: false
  endpoint: localhost:4318
  service_name: zhanggui-junshi-backend
  sample_ratio: 1.0
  insecure: true

cos:
  secret_id: ""
  secret_key: ""
  region: ap-guangzhou
  bucket: zhanggui-dev-1300000000
  endpoint: ""

multitenancy:
  strict: true
  # DEV ONLY: lets curl exercise the isolation guard via X-Mock-Tenant on the
  # boss/admin surfaces without logging in first (M5 added real login, but dev
  # keeps the mock-header fallback for quick manual testing). False in staging/prod.
  dev_mock_header: true
