# golangci-lint configuration (v2 schema; requires golangci-lint >= v2.0).
# Install: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
# Run from repo root: make lint  (-> cd backend && golangci-lint run ./...)
#
# Enables: govet / gofmt / staticcheck / errcheck / gosec / unused.
# In v2, gofmt is a formatter (formatters.enable), the rest are linters.
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - unused
  settings:
    govet:
      enable:
        - fieldalignment
        - shadow
    gosec:
      excludes:
        - G104 # errors are surfaced by errcheck instead
  exclusions:
    presets:
      - common
      - std-error-handling
    paths:
      - vendor
      - third_party
      - testdata
      - examples
      - ".*_test\\.go$"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
